secoes_extras:
- titulo: "🏢 Pessoa Jurídica — Documentos e Fluxos Impactados"
  descricao: "O CNPJ alfanumérico impacta diretamente todos os documentos e fluxos de Pessoa Jurídica."
  blocos:
  - subtitulo: "Documentos PJ que referenciam CNPJ"
    tabela:
      headers: [Documento, Impacto, "Ação Necessária"]
      rows:
      - ["Contrato Social", "CNPJ do sócio/empresa em campo numérico", "Atualizar template para aceitar alfanumérico"]
      - ["Procuração", "CNPJ do outorgante/outorgado", "Atualizar validação e máscara"]
      - ["Ficha Cadastral PJ", "Campo CNPJ com máscara numérica", "Atualizar máscara e regex"]
      - ["Comprovante de Abertura de Conta PJ", "CNPJ impresso no documento", "Atualizar template de geração"]
  - subtitulo: "Fluxos de Onboarding PJ"
    tabela:
      headers: [Etapa, Risco, "Recomendação"]
      rows:
      - ["Digitação do CNPJ", "Máscara numérica bloqueia letras", "Atualizar máscara para aceitar [A-Z0-9]"]
      - ["Consulta Receita Federal", "API pode retornar CNPJ alfanumérico", "Validar resposta da API"]
      - ["KYC / Background Check", "Parceiro pode rejeitar CNPJ alfanumérico", "Alinhar com parceiro de KYC"]

