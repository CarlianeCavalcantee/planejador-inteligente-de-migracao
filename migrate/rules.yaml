# Regras declarativas de transformação para migração CNPJ alfanumérico.
# Lib oficial: br.com.bscash.utils.DocumentoUtils (antiga DocumentoUtils)
#   DocumentoUtils.removeMascara(cnpj)  — remove [^A-Z0-9], faz toUpperCase
#   DocumentoUtils.formataCnpj(cnpj)    — aplica máscara XX.XXX.XXX/XXXX-DD
#   DocumentoUtils.estaFormatado(cnpj)  — valida máscara alfanumérica
#   DocumentoUtils.isBlank(cnpj)        — null/empty/blank check
#   DocumentoUtils.formataParaTamanhoFixo(doc, n) — campo fixo (CNAB) sem perder letras
#
# match      = regex Python (aplicada linha a linha)
# replace    = substituição (grupos \1, \2...)
# priority   = ordem de exibição no relatório (maior = mais importante)
# confidence = auto (aplica direto) | review (marca para revisão humana)
# examples   = lista de casos before/after para testes automatizados

# ─── RENAME ──────────────────────────────────────────────────────────────────

- id: RN-001
  language: java
  category: RENAME
  priority: 110
  match: '\bCnpjUtils\s*\.\s*(removeMascara|formataCnpj|estaFormatado|isBlank|formataParaTamanhoFixo)\s*\('
  replace: 'DocumentoUtils.\1('
  add_import: 'import br.com.bscash.utils.DocumentoUtils;'
  confidence: auto
  description: "CnpjUtils.x() -> DocumentoUtils.x() — classe renomeada para br.com.bscash.utils.DocumentoUtils"
  examples:
    - before: 'String doc = CnpjUtils.removeMascara(pagador.getDocumento());'
      after:  'String doc = DocumentoUtils.removeMascara(pagador.getDocumento());'
    - before: 'return CnpjUtils.formataCnpj(cnpj);'
      after:  'return DocumentoUtils.formataCnpj(cnpj);'

# ─── REMOVE MASK ─────────────────────────────────────────────────────────────

- id: RM-001
  language: java
  category: REMOVE_MASK
  priority: 100
  match: '((?:cnpj|cpfCnpj|cpf_cnpj|taxId|tax_id|documento)[\w.]*)\.replaceAll\s*\(\s*"[^"]*\[\^(?:0-9|A-Z0-9)[^"]*"\s*,\s*""\s*\)'
  replace: 'DocumentoUtils.removeMascara(\1)'
  add_import: 'import br.com.bscash.utils.DocumentoUtils;'
  confidence: auto
  description: "replaceAll('[^0-9]','') ou replaceAll('[^A-Z0-9]','') -> DocumentoUtils.removeMascara()"
  examples:
    - before: 'String clean = cnpj.replaceAll("[^0-9]", "");'
      after:  'String clean = DocumentoUtils.removeMascara(cnpj);'
    - before: 'String clean = cnpj.replaceAll("[^A-Z0-9]", "");'
      after:  'String clean = DocumentoUtils.removeMascara(cnpj);'

- id: RM-002
  language: ts
  category: REMOVE_MASK
  priority: 100
  match: '([\w.]+)\.replace\s*\(/\\D/g\s*,\s*[''"]{1}\s*[''"]{1}\s*\)'
  replace: 'DocumentoUtils.removeMascara(\1)'
  confidence: review
  description: ".replace(/\\D/g,'') -> DocumentoUtils.removeMascara() — confirmar se deve usar lib equivalente no frontend"
  examples:
    - before: "const clean = cnpj.replace(/\\D/g, '');"
      after:  "const clean = DocumentoUtils.removeMascara(cnpj);"

- id: RM-003
  language: java
  category: REMOVE_MASK
  priority: 95
  match: '([\w.]+)\.replace\s*\(\s*"\."\s*,\s*""\s*\)\.replace\s*\(\s*"/"\s*,\s*""\s*\)\.replace\s*\(\s*"-"\s*,\s*""\s*\)'
  replace: 'DocumentoUtils.removeMascara(\1)'
  add_import: 'import br.com.bscash.utils.DocumentoUtils;'
  confidence: auto
  description: "chain replace('.').replace('/').replace('-') -> DocumentoUtils.removeMascara()"
  examples:
    - before: 'String s = cnpj.replace(".", "").replace("/", "").replace("-", "");'
      after:  'String s = DocumentoUtils.removeMascara(cnpj);'

- id: RM-004
  language: java
  category: REMOVE_MASK
  priority: 98
  match: '([\w.]+)\.replaceAll\s*\(\s*"\[\^A-Z0-9\]"\s*,\s*""\s*\)'
  replace: 'DocumentoUtils.removeMascara(\1)'
  add_import: 'import br.com.bscash.utils.DocumentoUtils;'
  confidence: review
  description: "replaceAll('[^A-Z0-9]','') em qualquer variável -> DocumentoUtils.removeMascara() — confirmar que é CNPJ"
  examples:
    - before: 'String clean = value.replaceAll("[^A-Z0-9]", "");'
      after:  'String clean = DocumentoUtils.removeMascara(value);'


- id: RX-001
  language: java
  category: REGEX
  priority: 80
  match: 'compile\s*\(\s*"([^"]*)\[0-9\]([^"]*)"\s*\)'
  replace: 'compile("\1[A-Z0-9]\2")'
  confidence: review
  description: "Pattern.compile [0-9] -> [A-Z0-9] (preserva prefixo e sufixo)"
  examples:
    - before: 'Pattern p = compile("^[0-9]+$");'
      after:  'Pattern p = compile("^[A-Z0-9]+$");'
      confidence: review
    - before: 'Pattern p = compile("[0-9]+");'
      after:  'Pattern p = compile("[A-Z0-9]+");'
      confidence: review

- id: RX-003
  language: java
  category: REGEX
  priority: 90
  match: '"(\^?)\[0-9\]\{14\}(\$?)"'
  replace: '"\1[A-Z0-9]{14}\2"'
  confidence: auto
  description: "Regex [0-9]{14} -> [A-Z0-9]{14} (preserva ^ e $)"
  examples:
    - before: 'Pattern p = compile("^[0-9]{14}$");'
      after:  'Pattern p = compile("^[A-Z0-9]{14}$");'
    - before: 'String r = "[0-9]{14}";'
      after:  'String r = "[A-Z0-9]{14}";'

- id: RX-004
  language: java
  category: REGEX
  priority: 90
  match: '"(\^?)\\\\d\{14\}(\$?)"'
  replace: '"\1[A-Z0-9]{14}\2"'
  confidence: auto
