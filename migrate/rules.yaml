- id: SQL-001
  language: sql
  category: SQL
  priority: 70
  match: '(?i)(VARCHAR2?|CHAR)\s*\(\s*14\s*\)'
  replace: 'VARCHAR(20)'
  confidence: review
  description: "VARCHAR(14)/CHAR(14) -> VARCHAR(20)"
  examples:
    - before: '  cnpj VARCHAR(14) NOT NULL,'
      after:  '  cnpj VARCHAR(20) NOT NULL,'
      confidence: review
    - before: '  documento CHAR(14),'
      after:  '  documento VARCHAR(20),'
      confidence: review

- id: SQL-002
  language: sql
  category: SQL
  priority: 70
  match: '(?i)(NUMBER|BIGINT|NUMERIC)\s*\(\s*14\s*\)'
  replace: 'VARCHAR(20)'
  confidence: review
  description: "NUMBER(14)/BIGINT(14) -> VARCHAR(20)"
  examples:
    - before: '  cnpj NUMBER(14),'
      after:  '  cnpj VARCHAR(20),'
      confidence: review

- id: SQL-003
  language: sql
  category: SQL
  priority: 65
  match: '(?i)CHECK\s*\([^)]*\\d\{14\}[^)]*\)'
  replace: null
  confidence: review
  description: "CHECK constraint numérica com \\d{14} — sintaxe varia por banco. Revisar manualmente."
  examples:
    - before: "  CHECK (cnpj ~ '\\d{14}')"
      after:  "  -- PostgreSQL: CHECK (cnpj ~ '^[A-Z0-9]{14}$')\n  -- Oracle:     CHECK (REGEXP_LIKE(cnpj, '^[A-Z0-9]{14}$'))\n  -- MySQL:      CHECK (cnpj REGEXP '^[A-Z0-9]{14}$')"
      confidence: review

