      after:  "const re = /^[A-Z0-9]{14}$/;"
    - before: "const re = /[0-9]{14}/;"
      after:  "const re = /[A-Z0-9]{14}/;"

- id: RX-006
  language: ts
  category: REGEX
  priority: 90
  match: '/(\^?)\\d\{14\}(\$?)/'
  replace: '/\1[A-Z0-9]{14}\2/'
  confidence: auto
  description: "Regex JS /\\d{14}/ -> /[A-Z0-9]{14}/ (preserva ^ e $)"
  examples:
    - before: "const re = /^\\d{14}$/;"
      after:  "const re = /^[A-Z0-9]{14}$/;"
    - before: "const re = /\\d{14}/;"
      after:  "const re = /[A-Z0-9]{14}/;"

# ─── FORMATTER ───────────────────────────────────────────────────────────────

- id: FMT-001
  language: java
  category: FORMATTER
  priority: 85
  match: '([\w.]+)\s*=\s*CNPJ_FORMATADOR\.matcher\(([\w.]+)\)\.replaceAll\s*\(\s*"\$1\.\$2\.\$3/\$4-\$5"\s*\)'
  replace: '\1 = DocumentoUtils.formataCnpj(\2)'
  add_import: 'import br.com.bscash.utils.DocumentoUtils;'
  confidence: review
  description: "CNPJ_FORMATADOR.matcher(x).replaceAll() -> DocumentoUtils.formataCnpj(x) — confirmar que o Pattern local era numérico (o da DocumentoUtils já é alfanumérico)"
  examples:
    - before: 'result = CNPJ_FORMATADOR.matcher(value).replaceAll("$1.$2.$3/$4-$5");'
      after:  'result = DocumentoUtils.formataCnpj(value);'
    - before: 'formatted = CNPJ_FORMATADOR.matcher(cnpj).replaceAll("$1.$2.$3/$4-$5");'
      after:  'formatted = DocumentoUtils.formataCnpj(cnpj);'

- id: FMT-002
  language: java
  category: FORMATTER
  priority: 85
  match: '(formataCNPJ|formatarCNPJ|maskCNPJ|aplicaMascaraCNPJ)\s*\(\s*([\w.]+)\s*\)'
  replace: 'DocumentoUtils.formataCnpj(\2)'
  add_import: 'import br.com.bscash.utils.DocumentoUtils;'
  confidence: auto
  description: "formataCNPJ(x) -> DocumentoUtils.formataCnpj(x)"
  examples:
    - before: 'String f = formataCNPJ(cnpj);'
      after:  'String f = DocumentoUtils.formataCnpj(cnpj);'
    - before: 'return maskCNPJ(value);'
      after:  'return DocumentoUtils.formataCnpj(value);'

